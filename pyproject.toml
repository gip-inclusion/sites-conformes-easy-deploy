[project]
name = "sites-conformes-easy-deploy"
version = "0.1.0"
description = "Projet Django minimal pour déployer une instance de Sites Conformes"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sites-conformes>=4.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = [
    # Keep the test database between runs (only new migrations are applied); pass
    # --create-db to rebuild it, e.g. `make test ARGS=--create-db`
    "--reuse-db",
    "--strict-markers",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["config", "tests"]
